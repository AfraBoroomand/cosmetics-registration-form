<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود | Afra Cosmetics</title>
    <link rel="stylesheet" href="assets/styles/style.css" />
  </head>
  <body class="login-page">
    <div class="container">
      <h1>ورود به حساب کاربری</h1>
      <span class="meta">خوش آمدید، لطفا اطلاعات کاربری خود را وارد کنید.</span>
      <form action="#" method="post">
        <div class="formitem">
          <label for="user-identity">ایمیل یا شماره تماس</label>
          <input type="text" id="user-identity" name="identity" required />
        </div>
        <div class="formitem">
          <label for="password">رمز عبور</label>
          <input type="password" id="password" name="password" required />
        </div>
        <div class="form-actions">
          <div class="check">
            <input type="checkbox" id="remember-me" name="remember" />
            <label for="remember-me">من را به خاطر بسپار</label>
          </div>
          <a href="#" class="forgot-link">فراموشی رمز عبور؟</a>
        </div>
        <button type="submit">
          <span>ورود به حساب</span>
        </button>
        <div class="switch-form">
          <span>حساب کاربری ندارید؟</span>
          <a href="index.html">ثبت‌نام کنید</a>
        </div>
      </form>
    </div>
  </body>
</html>
